apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.notificationService.name }}
  labels:
    app: {{ .Values.notificationService.name }}
spec:
  replicas: {{ .Values.notificationService.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.notificationService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.notificationService.name }}
    spec:
      containers:
        - name: {{ .Values.notificationService.name }}
          image: "{{ .Values.notificationService.image.repository }}:{{ .Values.notificationService.image.tag }}"
          imagePullPolicy: {{ .Values.notificationService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.notificationService.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.notificationService.service.targetPort | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.notificationService.name }}
  labels:
    app: {{ .Values.notificationService.name }}
spec:
  type: {{ .Values.notificationService.service.type }}
  ports:
    - port: {{ .Values.notificationService.service.port }}
      targetPort: {{ .Values.notificationService.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.notificationService.name }}
